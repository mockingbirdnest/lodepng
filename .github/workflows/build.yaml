name: Build

on:
  push:
    branches: [ '*' ]
  pull_request:
    branches: [ '*' ]
  workflow_dispatch:

env:
  PRINCIPIA_HEADERS_LODEPNG: .
  PRINCIPIA_MSVC_LODEPNG: msvc
  PRINCIPIA_SOLUTION_LODEPNG: msvc/lodepng.slnf

jobs:
  build:
    runs-on: windows-2022
    strategy:
        matrix:
          configuration: [Debug, Release]
    steps:
    - name: Checkout source files
      uses: actions/checkout@v3

    - name: Initialize build environment
      uses: mockingbirdnest/actions/windows/initialize_build@main
      with:
        configuration: ${{ matrix.configuration }}

    - name: Rebuild ${{ matrix.configuration }}
      uses: mockingbirdnest/actions/windows/rebuild@main
      with:
        configuration: ${{ matrix.configuration }}
        solution_glob: ${{ env.PRINCIPIA_SOLUTION_LODEPNG }}

    - name: Upload artifact
      uses: mockingbirdnest/actions/windows/upload_artifact@main
      with:
        name: lodepng
        configuration: ${{ matrix.configuration }}
        headers_directory: ${{ env.PRINCIPIA_HEADERS_LODEPNG }}
        solution_directory: ${{ env.PRINCIPIA_MSVC_LODEPNG }}
